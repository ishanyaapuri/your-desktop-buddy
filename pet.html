<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Desktop Buddy</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      font-family: 'Impact', 'Arial Black', -apple-system, sans-serif;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 10px 15px;
      transform-origin: bottom right;
    }

    /* ================= UNIFIED VECTOR MANGA BUBBLE ================= */
    #speech-container {
      position: absolute;
      right: 136px;
      bottom: 85px;
      width: 174px;
      height: 76px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px) scale(0.94);
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 10;
      -webkit-app-region: no-drag;
    }

    #speech-container.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    /* 🫁 Guided Breathing Bubble Animations */
    .bubble-inhale {
      animation: guideInhale 4s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
    }

    .bubble-exhale {
      animation: guideExhale 4s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
    }

    @keyframes guideInhale {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-4px) scale(1.14); }
    }

    @keyframes guideExhale {
      0% { transform: translateY(-4px) scale(1.14); }
      100% { transform: translateY(0) scale(1); }
    }

    .bubble-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      filter: drop-shadow(3.5px 4.5px 0px #141414);
      z-index: 1;
    }

    .bubble-path {
      fill: #f4f3ef;
      stroke: #141414;
      stroke-width: 3.2;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    /* Perfectly centered content area */
    .bubble-content {
      position: absolute;
      top: 4px;
      left: 8px;
      width: 138px;
      height: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      text-align: center;
      z-index: 2;
    }

    #mode-tag {
      display: none;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #d96b52;
      margin-bottom: 2px;
      text-transform: uppercase;
    }

    .focus-mode-active #mode-tag {
      display: block;
    }

    #speech-text {
      color: #111111;
      font-size: 11.2px;
      font-weight: 900;
      letter-spacing: 0.4px;
      line-height: 1.22;
      text-transform: uppercase;
      word-break: break-word;
    }

    #bubble-close {
      position: absolute;
      top: 8px;
      left: 10px;
      font-family: sans-serif;
      font-size: 11px;
      font-weight: 900;
      color: #777;
      cursor: pointer;
      line-height: 1;
      padding: 2px 4px;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.2s ease, color 0.15s ease, transform 0.15s ease;
    }

    #speech-container:hover #bubble-close {
      opacity: 0.85;
    }

    #bubble-close:hover {
      opacity: 1 !important;
      color: #d96b52;
      transform: scale(1.2);
    }

    /* ================= PET CHARACTER ================= */
    #pet-container {
      position: relative;
      width: 145px;
      height: 145px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: bottom center;
      -webkit-app-region: drag;
      cursor: grab;
      opacity: 0;
    }

    #pet-container.active-visible {
      opacity: 1;
    }

    #pet-sprite {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.24));
      transform-origin: bottom center;
      animation: cuteBreathe 2.6s ease-in-out infinite;
    }

    @keyframes cuteBreathe {
      0%, 100% {
        transform: translateY(0) scale(1, 1);
      }
      50% {
        transform: translateY(-8px) scale(1.04, 0.95);
      }
    }

    .enter-bouncing {
      animation: hopIn 1.1s cubic-bezier(0.28, 0.84, 0.42, 1) forwards;
    }

    @keyframes hopIn {
      0% { transform: translate3d(160px, 40px, 0) scale(0.7, 1.2); opacity: 0; }
      40% { transform: translate3d(90px, -22px, 0) scale(1.08, 0.92); opacity: 1; }
      70% { transform: translate3d(30px, -12px, 0) scale(0.96, 1.04); opacity: 1; }
      85% { transform: translate3d(0, -4px, 0) scale(1.02, 0.98); opacity: 1; }
      100% { transform: translate3d(0, 0, 0) scale(1, 1); opacity: 1; }
    }

    .leave-bouncing {
      animation: hopOut 0.85s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes hopOut {
      0% { transform: translate3d(0, 0, 0) scale(1, 1); opacity: 1; }
      30% { transform: translate3d(40px, -20px, 0) scale(0.95, 1.05); opacity: 1; }
      100% { transform: translate3d(180px, 30px, 0) scale(0.8, 1.1); opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="stage">
    <!-- Vector Manga Speech Bubble -->
    <div id="speech-container">
      <span id="bubble-close" title="Dismiss">✕</span>
      
      <svg class="bubble-svg" viewBox="0 0 174 76" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path class="bubble-path" d="
          M 24 5
          L 134 5
          L 148 16
          L 150 28
          L 168 38
          L 150 46
          L 142 66
          L 26 67
          L 10 56
          L 6 36
          L 11 16
          Z" 
        />
      </svg>

      <div class="bubble-content">
        <span id="mode-tag">🎯 FOCUS</span>
        <span id="speech-text">HI!</span>
      </div>
    </div>

    <!-- Pet Character Sprite -->
    <div id="pet-container" title="Drag to move me!">
      <img id="pet-sprite" src="./assets/pet/character.png" alt="Desktop Buddy">
    </div>
  </div>

  <script>
    const stage = document.getElementById("stage");
    const petContainer = document.getElementById("pet-container");
    const petSprite = document.getElementById("pet-sprite");
    const speechContainer = document.getElementById("speech-container");
    const speechText = document.getElementById("speech-text");
    const bubbleClose = document.getElementById("bubble-close");

    let bubbleTimeout = null;
    let leaveTimeout = null;
    let breathTimeouts = [];

    const chillMessages = [
      "DROP YOUR SHOULDERS.",
      "JUST SITTING WITH YOU.",
      "REST YOUR EYES A BIT.",
      "YOU'VE BEEN WORKING HARD.",
      "TAKE A SLOW, DEEP BREATH.",
      "PROUD OF YOU TODAY.",
      "TIME TO STAND AND STRETCH?",
      "IT'S OKAY TO SLOW DOWN.",
      "LOOK OUT A WINDOW FOR A BIT.",
      "SNACK BREAK MAYBE?"
    ];

    const studyMessages = [
      "STAY LOCKED IN.",
      "DROP YOUR SHOULDERS.",
      "ONE TASK AT A TIME.",
      "PUT THE PHONE DOWN.",
      "LOOK OUT A WINDOW FOR A BIT.",
      "PROGRESS OVER PERFECTION.",
      "QUIET THE NOISE. EYES HERE.",
      "REST YOUR EYES A BIT.",
      "YOU'RE SMARTER THAN THIS PROBLEM.",
      "YOU'VE GOT THIS. KEEP GOING.",
      "EFFORT IS NEVER WASTED."
    ];

    const waterMessages = [
      "SIP SOME WATER!",
      "HYDRATION CHECK!",
      "GO GRAB A GLASS OF WATER."
    ];

    let chillIndex = 0;
    let studyIndex = 0;
    let waterIndex = 0;
    let lastTimeSlotVisited = "";

    function getTimeOfDayGreeting() {
      const hour = new Date().getHours();
      let currentSlot = "";
      let greetings = [];

      if (hour >= 6 && hour < 12) {
        currentSlot = "morning";
        greetings = ["GOOD MORNING! EASY PACE TODAY.", "MORNING! HOPE YOU SLEPT WELL."];
      } else if (hour >= 12 && hour < 17) {
        currentSlot = "afternoon";
        greetings = ["AFTERNOON SLUMP? BREATHE.", "HALFWAY THROUGH THE DAY!"];
      } else if (hour >= 17 && hour < 21) {
        currentSlot = "evening";
        greetings = ["GOOD EVENING. WINDING DOWN?", "EVENING CHECK-IN! STILL HERE."];
      } else {
        currentSlot = "night";
        greetings = ["GETTING LATE. REST SOON.", "LATE NIGHT? DON'T OVERDO IT."];
      }

      if (lastTimeSlotVisited !== currentSlot) {
        lastTimeSlotVisited = currentSlot;
        return greetings[Math.floor(Math.random() * greetings.length)];
      }

      return null;
    }

    function setPetScale(size) {
      if (size === "small") {
        stage.style.transform = "scale(0.85)";
      } else if (size === "large") {
        stage.style.transform = "scale(1.15)";
      } else {
        stage.style.transform = "scale(1)";
      }
    }

    function setAvatarImage(imgPath) {
      if (!imgPath) return;
      const src = imgPath.startsWith("http") || imgPath.startsWith("data:") 
        ? imgPath 
        : "file:///" + imgPath.replace(/\\/g, "/") + "?t=" + Date.now();
      petSprite.src = src;
    }

    function clearBreathingExercise() {
      breathTimeouts.forEach(t => clearTimeout(t));
      breathTimeouts = [];
      speechContainer.classList.remove("bubble-inhale");
      speechContainer.classList.remove("bubble-exhale");
    }

    function startBreathingExercise() {
      clearBreathingExercise();

      speechText.innerText = "BREATHE IN...";
      speechContainer.classList.add("bubble-inhale");

      breathTimeouts.push(setTimeout(() => {
        speechText.innerText = "(HOLD...)";
      }, 3800));

      breathTimeouts.push(setTimeout(() => {
        speechText.innerText = "BREATHE OUT...";
        speechContainer.classList.remove("bubble-inhale");
        speechContainer.classList.add("bubble-exhale");
      }, 5800));

      breathTimeouts.push(setTimeout(() => {
        speechText.innerText = "FEELS BETTER, RIGHT?";
        speechContainer.classList.remove("bubble-exhale");
      }, 9800));
    }

    function showBubble(text, durationMs = 15000) {
      clearBreathingExercise();
      speechText.innerText = text;
      speechContainer.classList.add("visible");

      if (text === "TAKE A SLOW, DEEP BREATH.") {
        setTimeout(startBreathingExercise, 1200);
        durationMs = 18000;
      }

      if (bubbleTimeout) clearTimeout(bubbleTimeout);
      bubbleTimeout = setTimeout(() => {
        speechContainer.classList.remove("visible");
        clearBreathingExercise();
      }, durationMs);
    }

    function doVisit(reminderType = "checkin", focusMode = false, dailyDayNumber = null) {
      let chosen = "";

      if (focusMode) {
        speechContainer.classList.add("focus-mode-active");
      } else {
        speechContainer.classList.remove("focus-mode-active");
      }

      if (dailyDayNumber) {
        chosen = `DAY ${dailyDayNumber} WORKING TOGETHER!`;
      } else if (reminderType === "water") {
        chosen = waterMessages[waterIndex % waterMessages.length];
        waterIndex++;
      } else {
        const timeGreeting = getTimeOfDayGreeting();
        if (timeGreeting && Math.random() > 0.3) {
          chosen = timeGreeting;
        } else if (focusMode) {
          chosen = studyMessages[studyIndex % studyMessages.length];
          studyIndex++;
        } else {
          chosen = chillMessages[chillIndex % chillMessages.length];
          chillIndex++;
        }
      }

      speechContainer.classList.remove("visible");
      petContainer.classList.remove("leave-bouncing");
      petContainer.classList.add("active-visible");
      petContainer.classList.add("enter-bouncing");

      const stayDuration = chosen === "TAKE A SLOW, DEEP BREATH." ? 20000 : 16000;

      setTimeout(() => {
        petContainer.classList.remove("enter-bouncing");
        showBubble(chosen, stayDuration - 2000);
      }, 1000);

      if (leaveTimeout) clearTimeout(leaveTimeout);
      leaveTimeout = setTimeout(() => {
        leaveScreen();
      }, stayDuration);
    }

    function leaveScreen() {
      clearBreathingExercise();
      speechContainer.classList.remove("visible");
      petContainer.classList.remove("enter-bouncing");
      petContainer.classList.add("leave-bouncing");

      setTimeout(() => {
        petContainer.classList.remove("active-visible");
        petContainer.classList.remove("leave-bouncing");
        window.companion.hidePet();
      }, 850);
    }

    bubbleClose.addEventListener("click", (e) => {
      e.stopPropagation();
      leaveScreen();
    });

    window.companion.onPetCommand((command, data) => {
      if (command === "visit") {
        if (data?.imagePath) setAvatarImage(data.imagePath);
        doVisit(data?.reminderType || "checkin", Boolean(data?.focusMode), data?.dailyDayNumber);
      } else if (command === "leave-now") {
        leaveScreen();
      } else if (command === "apply-size") {
        setPetScale(data?.size);
      } else if (command === "set-avatar") {
        setAvatarImage(data?.path);
      }
    });

    window.companion.notifyReady();
  </script>
</body>
</html>
